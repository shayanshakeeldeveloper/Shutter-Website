        .main {

        .row2 .img1,
        .row2 .img3,

        .row5 .img3 {
            width: 25%;
        }

        .row2 .img2,
        .row5 .img2 {

        }

        .row3 .img6,
        .row3 .img7,

        .row7 .img7 {

        }

        .row4 .img8,

        }

        .row8 .img8,
        .row8 .img9 {
            width: 50%;
        }

        /* =========================
           IMAGE CARD
        ========================= */

        .image-card {
            position: relative;
            display: block;
            height: 100%;
            overflow: hidden;
            cursor: pointer;
            isolation: isolate;
            background: #151515;
        }

        .image-card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.3, 1);
        }

        /* DARK OVERLAY USING BEFORE */

        .image-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, 0.88),
                    rgba(0, 0, 0, 0.35) 45%,
                    rgba(0, 0, 0, 0.05));
            opacity: 0;
            transition: opacity 0.45s ease;
            z-index: 1;
        }

        /* TEXT USING AFTER */

        .image-card::after {
            content: attr(data-title) "\A VIEW PHOTO  ↗";
            white-space: pre-line;
            position: absolute;
            left: 25px;
            right: 15px;
            bottom: 25px;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            line-height: 2.2;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(20px);
            transition:
                opacity 0.4s ease,
                transform 0.4s ease;
            z-index: 2;
        }

        /* HOVER EFFECTS */

        .image-card:hover::before {
            opacity: 1;
        }

        .image-card:hover::after {
            opacity: 1;
            transform: translateY(0);
        }

        .image-card:hover img {
            transform: scale(1.08);
        }

        /* KEYBOARD ACCESSIBILITY */

        .image-card:focus-visible {
            outline: 2px solid #fc4b4b;
            outline-offset: -3px;
        }

        .image-card:focus-visible::before,
        .image-card:focus-visible::after {
            opacity: 1;
        }

        .image-card:focus-visible::after {
            transform: translateY(0);
        }

        /* =========================
           FADE ANIMATIONS
        ========================= */

        .fade-down {
            opacity: 0;
            transform: translateY(-40px);
            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

        .fade-down.show {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-right {
            opacity: 0;
            transform: translateX(-50px);
            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

        .fade-right.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* =========================
           COPYRIGHT
        ========================= */

        .copy-right {
            width: 85%;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .copy-right a {
            color: #fc4b4b;
            text-decoration: none;
        }


    </style>
</head>

    <script>
        const animatedElements = document.querySelectorAll(
            ".fade-down, .fade-right"
        );

        if ("IntersectionObserver" in window) {
            const observer = new IntersectionObserver(
                (entries, observer) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("show");
                            observer.unobserve(entry.target);
                        }
                    });
                },
                {
                    threshold: 0.1
                }
            );

            animatedElements.forEach((element) => {
                observer.observe(element);
            });
        } else {
            animatedElements.forEach((element) => {
                element.classList.add("show");
            });
        }
    </script>
